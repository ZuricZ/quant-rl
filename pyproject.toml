[project]
name = "quant-rl"
version = "0.1.0"
# Development and the task image: the core and both environments in one
# install. Each environment publishes from its own pyproject (Decision 28).
description = "quantenv and both quant research environments, for development and the task image."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "polars>=2.1.0",
    "verifiers>=0.4.1,<0.5",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantenv", "environments/quant_research", "environments/quant_research_notools"]
exclude = ["environments/*/pyproject.toml", "environments/*/hatch_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
