[project]
name = "quant-research-notools"
version = "0.1.0"
description = "Quant research in one reply: write an alpha, scored by its rank IC on hidden data with lookahead checks."
readme = "README.md"
# Not a standard field: `prime env push` reads it for the Hub listing.
tags = ["quant", "finance", "backtesting", "reward-hacking", "single-turn"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "polars>=2.1.0",
    "verifiers>=0.4.1,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel holds this folder as `quant_research_notools` and the shared core
# `quantenv` from the repository root (spec, Decision 28).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "quant_research_notools/__init__.py"
"taskset.py" = "quant_research_notools/taskset.py"
"../../quantenv" = "quantenv"
