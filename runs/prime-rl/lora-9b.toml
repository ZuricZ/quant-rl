# Hosted Training on Prime: LoRA RL of Qwen3.5-9B on the no-tools taskset
# (quant-research-notools). A cheap preliminary run: does one-reply training
# move the reward at all? The run that matters will train the multi-turn tools
# taskset.
#
# - Qwen3.5-9B, the model of the Day 6 and 7 results; Hosted Training does not
#   offer Qwen3-4B-Instruct-2507.
# - 12288 completion tokens. Qwen3.5-9B thinks first, and its replies split in
#   two: with the final prompt at 16384 (results/day9, 120 replies) the median
#   was 2,911 tokens, 22% ran past 12288 and 18% hit 16384, mostly
#   re-checking; 31% ran past 8192. 12288 cuts off few more than 16384 and
#   shortens the slowest replies, which set the step time. The before/after
#   comparison is the run's own eval (step 0 against the last step), not
#   results/day9's 16384 baseline.
# - Sampling at Qwen's settings for thinking mode, temperature 0.6 and top_p
#   0.95, as in every results/ run. prime-rl's defaults (1.0 and 1.0) made the
#   base model's code much worse: run o8y6fkud's step-0 eval had 8 valid of 66
#   replies with code (day 9: about half), and 48% cut off at 8192.
# - Rollouts are graded in Prime sandboxes with the pushed task image
#   (`prime images push quant-research:0.1.4 --context .`), not local Docker.
# - 10 steps of 32 rollouts (4 tasks x 8). Groups whose replies all score the
#   same carry no signal and are resampled (83% at 4096 tokens in the smoke
#   run, about 2% expected here from day 9's 61% invalid rate).
#
#   prime train validate runs/prime-rl/lora-9b.toml
#   prime train runs/prime-rl/lora-9b.secret.toml
#
# The taskset id is the Hub id (owner/name): a hosted run installs the Hub
# environment it names, and verifiers imports `quant_research_notools` from it.
# The bare id installed nothing (runs xrl45ly3, o8u85xep: taskset not found).
#
# Dedicated runs forward only HF_TOKEN and WANDB_API_KEY, so the secret, which
# picks the datasets, cannot come from QUANT_RESEARCH_SECRET. It goes in an
# untracked copy, lora-9b.secret.toml (gitignored), with
# `env.taskset.secret = "..."` under both sources; an empty one fails the
# taskset. Prime keeps it in the run's config. The pipeline was proven by the
# smoke run lora-9b-smoke.toml (run o4jzyxsc, 27 November 2026): install,
# generation, sandbox grading, LoRA steps, eval and final checkpoint.
mode = "rl"
max_steps = 10
seq_len = 14336

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3.5-9B"

# LoRA takes a higher rate than full fine-tuning; 1e-5 would barely move 10
# steps. No weight decay, prime-rl's RL default. The rate stays constant
# (prime-rl's default scheduler): its warmup defaults to 10 steps, the whole
# run, and gradients are clipped at norm 1 (the smoke run's were about 0.08).
[trainer.optim]
lr = 5e-5
weight_decay = 0.0

[trainer.model.lora]
rank = 8
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj"
]

# batch_size counts rollouts: 4 tasks of group_size 8.
[orchestrator]
batch_size = 32

# Without a max length, vLLM sizes each episode for Qwen3.5's native 262,144
# tokens and the orchestrator ran 7 episodes at a time (run l9lgcetk). The cap
# bounds resampling: the smoke run had 195 episodes in flight when it ended.
[orchestrator.concurrency]
initial_inflight = 64
max_inflight = 96

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 12288
temperature = 0.6
top_p = 0.95

[[orchestrator.train.source]]
name = "quant-research-notools"
env.taskset.id = "zuricz/quant-research-notools"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "prime"
env.taskset.task.image = "prime/zuricz/quant-research:0.1.4"

# Two evals: the base model at startup and the trained one after the last
# step. 30 tasks x 2 rollouts = 60 episodes each, about two train steps.
[orchestrator.eval]
interval = 10

[orchestrator.eval.sampling]
max_completion_tokens = 12288
temperature = 0.6
top_p = 0.95

[[orchestrator.eval.source]]
name = "quant-research-notools-eval"
group_size = 2
env.taskset.id = "zuricz/quant-research-notools"
env.taskset.split = "eval"
env.agent.harness.id = "null"
env.agent.runtime.type = "prime"
env.taskset.task.image = "prime/zuricz/quant-research:0.1.4"

[ckpt] # Checkpoint at the end of training

[inference.vllm]
max_model_len = 14336
