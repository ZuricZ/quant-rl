[project]
name = "quant-research"
version = "0.1.2"
description = "Agentic quant research: find an alpha with limited backtests, scored on hidden data with lookahead checks."
readme = "README.md"
# Not a standard field: `prime env push` reads it for the Hub listing.
tags = ["quant", "finance", "backtesting", "reward-hacking", "multi-turn", "tools", "single-turn"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "polars==2.1.0",
    "polars-ds==0.14.0",
    "scikit-learn==1.9.1",
    "verifiers>=0.4.1,<0.5",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantenv", "environments/quant_research", "environments/quant_research_notools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
