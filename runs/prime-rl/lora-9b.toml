# Hosted Training on Prime: LoRA RL of Qwen3.5-9B on the no-tools taskset
# (quant-research-notools). Same run as notools-smoke.toml, adapted for a
# dedicated hosted run instead of a local prime-rl checkout:
#
# - Qwen3.5-9B, the model of the Day 6 and 7 results; Hosted Training does not
#   offer Qwen3-4B-Instruct-2507.
# - 16384 completion tokens, as in the qwen3_5-9b registry entry, so training
#   and the before/after eval (spec, Decision 29) sample alike; Qwen3.5-9B
#   thinks first, and at 8192 it ran out while thinking in 73 of 120 no-tools
#   replies (results/day9). seq_len leaves room for the prompt (about 1,800
#   tokens).
# - Rollouts are graded in Prime sandboxes with the pushed task image
#   (`prime images push quant-research:0.1.4 --context .`), not local Docker.
# - 10 steps: a smoke run that shows the pipeline trains, checkpoints and
#   scores, not a result.
#
#   prime train validate runs/prime-rl/lora-9b.toml
#   prime train runs/prime-rl/lora-9b.secret.toml
#
# The taskset id is the Hub id (owner/name): a hosted run installs the Hub
# environment it names, and verifiers imports `quant_research_notools` from it.
# The bare id installed nothing (runs xrl45ly3, o8u85xep: taskset not found).
#
# Dedicated runs forward only HF_TOKEN and WANDB_API_KEY, so the secret, which
# picks the datasets, cannot come from QUANT_RESEARCH_SECRET. It goes in an
# untracked copy, lora-9b.secret.toml (gitignored), with
# `env.taskset.secret = "..."` under both sources; an empty one fails the
# taskset. Prime keeps it in the run's config. Validated on 27
# November 2026 against the hosted runtime's prime-rl 4cec527 (v0.11.0); not
# yet submitted. Unchecked until submission: whether a dedicated run accepts
# LoRA, whether the runner finds the quant-research-notools taskset, which
# ships inside the Hub environment zuricz/quant-research, and whether the
# grading sandboxes can pull the private image.
mode = "rl"
max_steps = 10
seq_len = 18432

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3.5-9B"

[trainer.optim]
lr = 1e-5
weight_decay = 0.0

[trainer.model.lora]
rank = 8
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj"
]

# Small batches: grading, not generation, bounds the step time.
[orchestrator]
batch_size = 32

# Without a max length, vLLM sizes each episode for Qwen3.5's native 262,144
# tokens and the orchestrator ran 7 episodes at a time (run l9lgcetk); an
# episode needs at most seq_len, so the KV cache holds about 100.
[orchestrator.concurrency]
initial_inflight = 64

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 16384

[[orchestrator.train.source]]
name = "quant-research-notools"
env.taskset.id = "zuricz/quant-research-notools"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "prime"
env.taskset.task.image = "prime/zuricz/quant-research:0.1.4"

# The startup eval scores the base model; then every 10 steps, so a 10-step
# smoke run also scores a trained model and a 100-step run gives 11 points.
# 30 tasks x 4 rollouts = 120 episodes, as in results/day9, under half a
# train step's 256 gradings.
[orchestrator.eval]
interval = 10

[orchestrator.eval.sampling]
max_completion_tokens = 16384

[[orchestrator.eval.source]]
name = "quant-research-notools-eval"
group_size = 4
env.taskset.id = "zuricz/quant-research-notools"
env.taskset.split = "eval"
env.agent.harness.id = "null"
env.agent.runtime.type = "prime"
env.taskset.task.image = "prime/zuricz/quant-research:0.1.4"

[ckpt] # Checkpoint at the end of training

[inference.vllm]
max_model_len = 18432
