# Tests and taskset validation on every pull request and push to main.
# verifiers needs Linux (fcntl), so these tests cannot run on Windows.
name: test

on:
  pull_request:
  push:
    branches: [main]

# No step needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q -p no:cacheprovider

      - name: Build the task image
        run: docker build -t quant-research:0.1.4 .

      # The sandbox tests need root, to run alpha code as `nobody`, so they
      # skip in the step above. They run here inside the task image, where
      # real episodes run their alpha code: on the runner itself, `nobody`
      # cannot enter /home/runner to start uv's Python.
      - name: Sandbox tests as root, in the task image
        run: >-
          docker run --rm -e QUANT_RESEARCH_IMAGE=1
          -v "$PWD/tests/test_sandbox.py:/tests/test_sandbox.py:ro"
          quant-research:0.1.4
          sh -c "pip install -q --root-user-action=ignore pytest &&
          python -m pytest -q -p no:cacheprovider /tests/test_sandbox.py"

      - name: Validate the tasksets in Docker
        env:
          # Validation only; not the secret of any published run.
          QUANT_RESEARCH_SECRET: ci-validate
        run: |
          uv run vf-validate quant-research --runtime.type docker -n 2
          uv run vf-validate quant-research-notools --runtime.type docker -n 2

      # vf-validate never starts the research toolset, so it cannot see the
      # toolset fail to install in the container. One scripted episode does:
      # verifiers installs the toolset there, the stub model calls describe,
      # backtest and submit, and the grader scores the submission. A second
      # episode, of the no-tools taskset, checks the route of the before and
      # after RL evaluation through run_models.py and results.py. The stub
      # runs on the venv's python, not `uv run`, which would hold uv's cache
      # lock and block setup-uv's cache prune after the job.
      - name: Scripted episodes in Docker
        run: |
          .venv/bin/python scripts/stub_model.py &
          trap "kill $!" EXIT
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:8765/v1/models > /dev/null; do sleep 1; done'
          uv run python scripts/run_models.py stub --secret ci-episode --tasks 1 --rollouts 1 --out outputs/ci
          uv run python scripts/run_models.py stub --taskset quant-research-notools --secret ci-episode --tasks 1 --rollouts 1 --out outputs/ci
          uv run python - <<'EOF'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import results

          (row,) = results.run_rows(Path("outputs/ci/stub")).iter_rows(named=True)
          print(row)
          assert row["ok"] and not row["error"], "the episode errored"
          assert row["backtests_used"] == 1, "the backtest did not run"
          assert row["invalid"] == 0 and row["sharpe"] is not None, "not graded"

          (row,) = results.run_rows(Path("outputs/ci/stub-notools")).iter_rows(named=True)
          print(row)
          assert row["ok"] and not row["error"], "the no-tools episode errored"
          assert row["invalid"] == 0 and row["ic"] is not None, "no-tools not graded"
          assert row["reward"] is not None and row["budget"] is None, "no-tools reward"
          EOF
